<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Toolkit Helper</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><img src="toolbox.png" alt=""><div><h1>Browser Toolkit</h1><p>Custom script manager</p></div></header>
<main>
<div class="toolbar"><button id="newScript">＋ New script</button><button id="importScripts" class="quiet">Import JSON</button><input id="fileInput" type="file" accept=".json,.bookmarklet.json,application/json" multiple hidden></div>
<p id="status" role="status">The bookmarklet syncs the public scripts automatically. This helper is only for your custom scripts.</p>
<section id="scriptList"></section>
<form id="editor" hidden>
<div class="editor-head"><h2 id="editorTitle">New custom script</h2><button type="button" id="cancelEdit" class="icon-button">×</button></div>
<label>Bookmarklet JSON<textarea id="jsonEditor" required spellcheck="false"></textarea></label>
<p class="hint">Edit the JSON template, then save. Export downloads a .bookmarklet.json file.</p>
<div class="toolbar"><button type="submit">Save script</button><button type="button" id="exportDraft" class="quiet">Export JSON</button></div>
</form>
</main>
<script src="popup.js"></script>
</body>
</html>
